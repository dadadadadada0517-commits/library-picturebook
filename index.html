<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>咱做伙來圖書館行踏｜動態繪本版</title>
<meta name="description" content="台語散文〈咱做伙來圖書館行踏〉（張浩盛）的剪紙偶動態繪本版，共三段。">
<style>
@font-face { font-family: "WenKai"; src: url("fonts/wenkai-bold.ttf"); font-weight: 700; font-display: block; }
html, body { margin: 0; background: #2a2119; height: 100%; overflow: hidden; }
#stage { position: relative; width: 100vw; height: 56.25vw; max-height: calc(100vh - 44px); max-width: calc((100vh - 44px) * 16 / 9); margin: 0 auto; }
#c { display: block; width: 100%; height: 100%; cursor: pointer; }
#hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
#hint span { background: #F3EAD6; color: #403B34; font: 700 clamp(16px, 2.6vw, 30px) "WenKai", sans-serif; padding: .5em 1.2em; box-shadow: 3px 6px 12px rgba(40,28,15,.4); transform: rotate(-1.5deg); }
body.cap #stage { width: 1920px; height: 1080px; max-width: none; max-height: none; }
body.cap #ui, body.cap #hint { display: none; }
#ui { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; color: #e9dfc8; font: 14px sans-serif; box-sizing: border-box; }
#ui a { color: #e9dfc8; text-decoration: none; padding: 4px 10px; border: 1px solid #6b5a45; white-space: nowrap; }
#ui a.on { background: #B75B45; border-color: #B75B45; }
#bar { flex: 1; min-width: 60px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas><div id="hint"><span>點一下開始播放</span></div></div>
<div id="ui"><a href="?part=1" data-p="1">第一段</a><a href="?part=2" data-p="2">第二段</a><a href="?part=3" data-p="3">第三段</a><input id="bar" type="range" min="0" max="84" step="0.05" value="0"></div>
<audio id="au" preload="auto"></audio>
<script>
if (location.search.includes('capture')) document.body.classList.add('cap');
// ?part=1｜2｜3 選哪一段
const PART = (location.search.match(/part=([123])/) || [0, '1'])[1];
for (const a of document.querySelectorAll('#ui a')) if (a.dataset.p === PART) a.className = 'on';
document.getElementById('au').src = `src/audio_p${PART}.m4a`;
for (const f of [`js/data_p${PART}.js`, 'js/engine.js', `js/scenes_p${PART}.js`]) document.write(`<script src="${f}"><\/script>`);
document.write('<script>boot();<\/script>');
</script>
</body>
</html>
